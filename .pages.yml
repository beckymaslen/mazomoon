# Settings for the blog editor at https://app.pagescms.org
# The book list below is refreshed by tools/build_pages.py from the bookshelf.
media:
  input: img/reviews
  output: /img/reviews
content:
  - name: reviews
    label: Book reviews
    type: collection
    path: content/reviews
    filename: "{primary}.md"
    view:
      fields: [title, book, date, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The headline for your review, for example "Glow made me cry on the school run".
      - name: book
        label: Book
        type: select
        required: true
        description: Pick the book from your shelf. The review gets linked from that spine.
        options:
          values:
            # books-start
            - "A Blackened Bond"
            - "A Court of Frost and Starlight"
