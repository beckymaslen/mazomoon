# Once a day, copies each post's view total from Rebecca's Google Sheet into the post file,
# so Pages CMS shows it next to the title. It only touches the `views:` line.
name: Update view counts
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: views
jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown pyyaml pillow
      - run: python3 tools/views.py
      - name: Save the new totals
        run: |
          git config user.name "Mazo Moon views"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet && exit 0
          git commit -m "Update view counts"
          git pull --rebase origin main
          git push origin HEAD:main
