<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mazo Moon: journals, colouring books and stationery from a Yorkshire family business. Shop, read and say hello.">
<meta property="og:title" content="Mazo Moon">
<meta property="og:description" content="Make a little space for you.">
<meta property="og:image" content="https://www.mazomoon.com/img/journal-spread.jpg">
<link rel="icon" href="../img/favicon.png">
<title>Mazo Moon | Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
:root{
  --surface:#f7f4ef; --raised:#fbf9f6; --sunken:#e7e2dc; --feature:#80615f;
  --text:#434342; --muted:#675f5b; --accent:#967a85; --hairline:#d9d2cb; --focus:#80615f; --on-feature:#f7f4ef;
  --sage:#a9b39c; --blue:#a3b2bf; --blush:#dcbcb3; --honey:#d4b47e; --plum:#8c7282; --paper:#fdfbf7;
  --display:"Cormorant Garamond",Georgia,serif; --sans:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#303133; --raised:#3a3b3c; --sunken:#434342; --text:#f7f4ef; --muted:#b9b0aa; --accent:#c4a9b4; --hairline:#4d4e4f; --focus:#c4a9b4; --paper:#efebe4; color-scheme:dark}}
:root[data-theme="dark"]{--surface:#303133; --raised:#3a3b3c; --sunken:#434342; --text:#f7f4ef; --muted:#b9b0aa; --accent:#c4a9b4; --hairline:#4d4e4f; --focus:#c4a9b4; --paper:#efebe4; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--text);font:16px/26px var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(rgba(128,97,95,.06) 1px,transparent 1.2px);background-size:22px 22px}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}
.page{max-width:480px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));position:relative}

/* header: wordmark writes itself in, stickers scattered around it */
.top{position:relative;height:256px;margin-bottom:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wm{position:absolute;left:50%;top:130px;transform:translateX(-50%);width:min(78%,300px);aspect-ratio:900/124;background:var(--text);
  -webkit-mask:url(../img/wordmark-mask.png) center/contain no-repeat;mask:url(../img/wordmark-mask.png) center/contain no-repeat;
  clip-path:inset(-10% 100% -10% 0);animation:write 1.4s .2s cubic-bezier(.55,0,.35,1) forwards}
@keyframes write{to{clip-path:inset(-10% 0 -10% 0)}}
.tag{position:absolute;left:0;right:0;top:184px;text-align:center;font:italic 500 21px/28px var(--display);color:var(--muted);opacity:0;animation:fade .8s 1.4s forwards}
.where{position:absolute;left:0;right:0;top:218px;text-align:center;font:500 11px/16px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:0;animation:fade .8s 1.6s forwards}
@keyframes fade{to{opacity:1}}
.stk{position:absolute;left:0;top:0;width:var(--w);padding:0;border:0;background:none;cursor:grab;touch-action:none;
  transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(var(--s,1));transition:transform .5s cubic-bezier(.3,1.45,.5,1);
  will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-tap-highlight-color:transparent;animation:pop .6s var(--d) cubic-bezier(.3,1.6,.5,1) backwards}
.stk img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 3px 4px rgba(48,49,51,.18));transform:translateZ(0);transition:filter .3s}
.stk.drag{cursor:grabbing;transition:none;--s:1.12}
.stk.drag img{filter:drop-shadow(0 12px 14px rgba(48,49,51,.22))}
@keyframes pop{from{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(0)}}
.hint{text-align:center;font-size:12px;line-height:18px;color:var(--muted);margin:0 0 22px}

/* links as journal pages with index tabs */
.links{list-style:none;margin:0;padding:0 14px 0 0;display:grid;gap:14px}
.lk{position:relative;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 18px;background:var(--raised);
  text-decoration:none;border:1px solid var(--hairline);box-shadow:0 1px 0 var(--hairline),0 2px 0 var(--surface),0 3px 0 var(--hairline);
  transform:rotate(var(--t,0deg));transition:transform .45s cubic-bezier(.3,1.5,.5,1),box-shadow .3s;opacity:0;animation:slide .6s var(--d) cubic-bezier(.2,1.2,.4,1) forwards}
.lk::after{content:"";position:absolute;right:-15px;top:12px;width:15px;height:28px;background:var(--tab);border-radius:0 3px 3px 0;transition:width .3s,right .3s}
.lk:hover,.lk:focus-visible{transform:rotate(0) translateY(-3px);box-shadow:0 10px 22px rgba(48,49,51,.1)}
.lk:hover::after,.lk:focus-visible::after{right:-22px;width:22px}
.lk:active{transform:scale(.98)}
@keyframes slide{from{opacity:0;transform:translateX(-24px) rotate(var(--t,0deg))}to{opacity:1}}
.lk .ic{flex:none;width:42px;height:42px;display:grid;place-items:center;background:var(--tab);color:#303133}
.lk .ic svg{width:22px;height:22px}
.lk b{display:block;font:600 21px/26px var(--display)}
.lk small{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.lk.hero{background:var(--feature);color:var(--on-feature);border-color:var(--feature);box-shadow:0 8px 24px rgba(128,97,95,.25)}
.lk.hero small{color:rgba(247,244,239,.8)}
.lk.hero .ic{background:var(--paper)}
.new{margin-left:auto;flex:none;font:500 10px/14px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;background:var(--honey);color:#303133;transform:rotate(4deg)}

/* today's reminder: tap the envelope */
.rem{margin:34px 0 0;text-align:center}
.rem h2,.shelf h2{font:500 11px/16px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
.card{position:relative;width:100%;height:150px;perspective:900px;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.card.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:18px 24px;border:1px solid var(--hairline)}
.front{background:var(--sunken)}
.front span{font:italic 500 22px/28px var(--display)}
.front em{display:block;font:normal 400 12px/18px var(--sans);color:var(--muted);margin-top:6px}
.back{background:var(--paper);color:#434342;transform:rotateY(180deg);font:italic 500 26px/32px var(--display);
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(150,122,133,.22) 31px 32px);background-position:0 14px}
.again{margin-top:10px;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit}

/* bookshelf: swipe the newest journals */
.shelf{margin:38px -16px 0}
.shelf h2{padding:0 16px;text-align:center}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 22px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.bk{flex:none;width:138px;scroll-snap-align:center;text-decoration:none;text-align:center}
.bk .cv{display:block;position:relative;aspect-ratio:2/3;perspective:700px;margin-bottom:10px}
.bk .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;box-shadow:0 8px 18px rgba(48,49,51,.18)}
.bk .cv .pg{filter:none;box-shadow:0 8px 18px rgba(48,49,51,.12)}
.bk .cv .fr{transform-origin:left center;transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
.bk:hover .fr,.bk:focus-visible .fr,.bk.peek .fr{transform:rotateY(-62deg)}
.bk b{display:block;font:600 16px/20px var(--display)}
.bk small{font-size:12px;color:var(--muted)}

.foot{margin-top:30px;text-align:center;font-size:13px;line-height:20px;color:var(--muted)}
.foot .clock{font:italic 500 18px/24px var(--display);color:var(--text);margin-bottom:6px}
.foot a{color:var(--text)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.wm{clip-path:none}}
</style>
<script src="/consent.js" defer></script>
</head>
<body>
<main class="page">
  <header class="top" id="top">
    <h1 class="wm" role="img" aria-label="Mazo Moon" style="margin:0"></h1>
    <p class="tag">Make a little space for you.</p>
    <p class="where">A Yorkshire family business</p>
  </header>
  <p class="hint">✦ Psst, the stickers move. Tap one to stick it somewhere new.</p>

  <ul class="links" id="links"></ul>

  <section class="rem" aria-labelledby="remH">
    <h2 id="remH">Today's little reminder</h2>
    <button class="card" id="card" type="button" aria-live="polite">
      <span class="in">
        <span class="face front"><span>There's a note here for you.<em>Tap to open it</em></span></span>
        <span class="face back" id="note">Rest is productive too.</span>
      </span>
    </button>
    <button class="again" id="again" type="button" hidden>Another one, please</button>
  </section>

  <section class="shelf" aria-labelledby="shelfH">
    <h2 id="shelfH">Fresh off the press</h2>
    <div class="row" id="row"></div>
  </section>

  <footer class="foot">
    <p class="clock" id="clock"></p>
    <p><a href="https://www.instagram.com/mazomoon/" target="_blank" rel="noopener">Instagram</a> · <a href="https://uk.pinterest.com/mazomoon/" target="_blank" rel="noopener">Pinterest</a></p>
    <p><a href="mailto:hello@mazomoon.com">hello@mazomoon.com</a> · <a href="/">mazomoon.com</a></p>
  </footer>
</main>

<script>
(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAAS='maas=maas_adg_5620BE20E00531051704C67F4D1D438F_afap_abs&ref_=aa_maas&tag=maas';
const AMZ=a=>'https://www.amazon.co.uk/dp/'+a+'?'+MAAS;
const I={
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5c3-1 6-1 8 1v13c-2-2-5-2-8-1z"/><path d="M20 5c-3-1-6-1-8 1v13c2-2 5-2 8-1z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10z"/></svg>',
  sticker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h14v9l-6 7H5z"/><path d="M13 20v-5a2 2 0 0 1 2-2h4"/></svg>',
  cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3c-1 1.5 1 2.5 0 4M12 3c-1 1.5 1 2.5 0 4"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16"/><path d="M8 15c2-4 3 1 5-3s2 2 3 0"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 15A8 8 0 0 1 9 5a8 8 0 1 0 10 10z"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13"/><path d="m3 7 9 7 9-7"/></svg>'
};
const links=[
  {t:'Stickers',s:'Little reminders for everyday spaces',h:'https://www.amazon.co.uk/stores/page/73DFC740-CE20-4697-BA96-53EC28130B3A?'+MAAS,i:'sticker',tab:'var(--blue)'},
  {t:'Kids journals',s:'Keepsake journals to fill and treasure',h:'https://www.amazon.co.uk/stores/page/C9FD7E12-0264-4604-9F63-3E4BF264284F?'+MAAS,i:'star',tab:'var(--honey)'},
  {t:'Kids activity & drawing books',s:'Comics, stories and pages to doodle on',h:'https://www.amazon.co.uk/stores/page/05BEAA98-D95E-40D3-AAF7-9F004EDF1FA0?'+MAAS,i:'pencil',tab:'var(--sage)'},
  {t:'Adult colouring books',s:'Slow pages to colour and wander through',h:'https://www.amazon.co.uk/stores/page/574CB505-1263-46CF-9804-2291B501D6C0?'+MAAS,i:'book',tab:'var(--plum)'},
  {t:'Pens',s:'Fine needle tip gel pens in lots of colours',h:'https://www.amazon.co.uk/stores/page/E17B6F9E-EF57-4D12-8484-7519364938E0?'+MAAS,i:'pen',tab:'var(--blush)'},
  {t:'Earbuds & sleep masks',s:'Soft NoiseBuds and masks for calmer rest',h:'https://www.amazon.co.uk/stores/page/507344C8-7E00-4174-8806-5BC9013998A9?'+MAAS,i:'moon',tab:'var(--blue)'},
  {t:'The Reading Corner',s:'My book blog. Honest reviews, plenty of tea',h:'/reading/',i:'cup',tab:'var(--honey)'},
  {t:'Mazo Moon Amazon store',s:'Everything I make, all in one place',h:'https://www.amazon.co.uk/stores/page/298754B3-2DA8-49CE-B163-4EA6E7FEA0E0?'+MAAS,i:'bag',tab:'var(--blush)',hero:1},
  {t:'mazomoon.com',s:'The main website',h:'/',i:'home',tab:'var(--sage)'}
];
const ext=h=>/^https?:/.test(h);
document.getElementById('links').innerHTML=links.map((l,k)=>`<li><a class="lk${l.hero?' hero':''}" href="${l.h}"${ext(l.h)?' target="_blank" rel="noopener"':''} style="--tab:${l.tab};--t:${(k%2?.6:-.6)}deg;--d:${(1.5+k*.08).toFixed(2)}s">
  <span class="ic" aria-hidden="true">${I[l.i]}</span><span><b>${l.t}</b><small>${l.s}</small></span>${l.nw?'<span class="new">New</span>':''}</a></li>`).join('');

/* stickers around the wordmark: drag them, or tap to send them somewhere new */
const top=document.getElementById('top');
const pool=['aff02','aff07','aff14','aff21','aff30','tm07','tm16','tm38','vq05','vq17','vq31','vq44','dr10','aff38','tm49'];
const pick=pool.sort(()=>Math.random()-.5).slice(0,5);
/* stickers live in the band above the wordmark so it always stays readable */
const spots=[[0,.06],[.25,.0],[.5,.1],[.75,.02],[1,.08]];
let z=1;
function place(b,i){
  const W=top.clientWidth,H=124,w=parseFloat(b.style.getPropertyValue('--w'));
  const [fx,fy]=spots[i%spots.length];
  b.style.setProperty('--x',Math.round(fx*(W-w)+Math.random()*14-7)+'px');
  b.style.setProperty('--y',Math.round(fy*(H-w)+Math.random()*10-5)+'px');
  b.style.setProperty('--r',(Math.random()*30-15).toFixed(1)+'deg');
}
pick.forEach((k,i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='stk';
  b.setAttribute('aria-label','A Mazo Moon sticker. Tap to move it.');
  const w=Math.round(Math.min(96,top.clientWidth*.2)*(.9+Math.random()*.2));
  b.style.setProperty('--w',w+'px'); b.style.setProperty('--d',(1.1+i*.09).toFixed(2)+'s'); b.style.zIndex=++z;
  b.innerHTML=`<img src="../img/cut/${k}.webp" alt="" draggable="false">`;
  top.appendChild(b); place(b,i);
  let sx,sy,ox,oy,moved=false;
  b.addEventListener('pointerdown',e=>{ b.setPointerCapture(e.pointerId); moved=false; sx=e.clientX; sy=e.clientY;
    ox=parseFloat(getComputedStyle(b).getPropertyValue('--x')); oy=parseFloat(getComputedStyle(b).getPropertyValue('--y')); b.style.zIndex=++z; });
  b.addEventListener('pointermove',e=>{ if(!b.hasPointerCapture(e.pointerId)) return; const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.hypot(dx,dy)<5) return; moved=true; b.classList.add('drag');
    b.style.setProperty('--x',(ox+dx)+'px'); b.style.setProperty('--y',(oy+dy)+'px'); b.style.setProperty('--r',(dx*.08).toFixed(1)+'deg'); });
  const end=()=>{ b.classList.remove('drag'); if(!moved){ place(b,Math.floor(Math.random()*spots.length)); } else b.style.setProperty('--r',(Math.random()*24-12).toFixed(1)+'deg'); };
  b.addEventListener('pointerup',end); b.addEventListener('pointercancel',end);
  b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); place(b,Math.floor(Math.random()*spots.length)); } });
});

/* reminder card */
const notes=['Rest is productive too.','You don\'t have to finish the whole page today.','Small steps still count.','Put the kettle on. The list can wait.','Be as kind to yourself as you are to your friends.','Done is lovely. Perfect is optional.','One page at a time.','You are allowed to take up space.','Today is a good day to start again.','Notice one nice thing before bed.'];
const card=document.getElementById('card'), note=document.getElementById('note'), again=document.getElementById('again');
let last=-1; const draw=()=>{ let n; do{ n=Math.floor(Math.random()*notes.length); }while(n===last); last=n; note.textContent=notes[n]; };
card.addEventListener('click',()=>{ if(!card.classList.contains('open')){ draw(); card.classList.add('open'); again.hidden=false; } });
again.addEventListener('click',()=>{ card.classList.remove('open'); setTimeout(()=>{ draw(); card.classList.add('open'); }, reduce?0:500); });

/* bookshelf: covers open to show a page inside */
const books=[
  ['The Storymaker\'s Journal','B0HP8HW6B5','storymakers-journal'],
  ['The Storymaker\'s Comic Book','B0HQ58GQHC','storymakers-comic'],
  ['My Adventure Travel Journal','B0HNY91X4S','adventure-travel-journal'],
  ['Our Journey Together','B0HNXQFDD2','our-journey-together'],
  ['The Year I Started Secondary School','B0HPGTGRH9','started-secondary'],
  ['A Cup of Somewhere Else','B0HQMNRV6L','cup-of-somewhere-else'],
  ['A Little Everyday Magic','B0HR61HP7C','little-everyday-magic'],
  ['Just One More Chapter','B0HR61TKFL','just-one-more-chapter']
];
document.getElementById('row').innerHTML=books.map(([n,a,img])=>`<a class="bk" href="${AMZ(a)}" target="_blank" rel="noopener">
  <span class="cv"><img class="pg" src="../img/inside-${img}.jpg" alt="" loading="lazy"><img class="fr" src="../img/${img}.jpg" alt="${n} cover" loading="lazy"></span>
  <b>${n}</b><small>Buy on Amazon</small></a>`).join('');
if(!reduce && 'IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting && e.intersectionRatio>.9){ e.target.classList.add('peek'); setTimeout(()=>e.target.classList.remove('peek'),1200); } }),{root:document.getElementById('row'),threshold:[.9]});
  document.querySelectorAll('.bk').forEach(b=>io.observe(b));
}

/* Yorkshire clock */
const clock=document.getElementById('clock');
const tick=()=>{ const d=new Date(); const t=d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Europe/London'}).replace(' ','');
  const h=+d.toLocaleString('en-GB',{hour:'numeric',hour12:false,timeZone:'Europe/London'});
  const m=h<6?'Fast asleep, hopefully.':h<10?'First brew of the day.':h<12?'Elevenses o\'clock.':h<14?'Lunch and a few pages.':h<17?'Afternoon tea and a page or two.':h<21?'Feet up, pen out.':'One more chapter.';
  clock.textContent=`It's ${t} in Yorkshire. ${m}`; };
tick(); setInterval(tick,30000);
})();
</script>
</body>
</html>
